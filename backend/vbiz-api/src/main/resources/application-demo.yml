# A public demo (docs/ops/demo.md): the demo shops, salons and accounts (db/seed-local) and the
# KHQR payment simulator, so anyone can try VirtualBiz without real bank accounts. Real secrets and
# secure cookies, unlike `local`. It is a public URL, so it treats codes and links like production:
# sign-up, email-code and reset codes and team invites go out by email only (VBIZ_MAIL_*), never in
# an API reply or on screen (the API refuses to start otherwise, config/DevExposureGuard).
# Demo data only: never point it at a real database.
spring:
  datasource:
    # Render gives the database as host, port, name, user and password (render.yaml).
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}}
    username: ${DATABASE_USERNAME:${DB_USER}}
    password: ${DATABASE_PASSWORD:${DB_PASSWORD}}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration,classpath:db/seed-local

vbiz:
  jwt:
    secret: ${VBIZ_JWT_SECRET}
  security:
    data-key: ${VBIZ_DATA_KEY}
  staff:
    app-url: ${VBIZ_APP_URL}
    # Invite links let their holder join a shop or the console: emailed only.
    expose-dev-links: false
  auth:
    cookie-secure: true
    # The fake Google chooser signs in as any address: off on a public URL.
    google-dev-enabled: false
  mail:
    # The demo's made-up accounts (db/seed-local) belong to nobody, or to a stranger: never email
    # them. People who sign up on the demo get their emails like anywhere else.
    never-to: >-
      virtualbiz.com, shops.virtualbiz.com, glowbeauty.com.kh, nitagadget.com.kh, example.com,
      alex.noman@gmail.com, hay.kongmeng@gmail.com, lang.cutties@gmail.com, monika.lim@gmail.com,
      pisey.sorn@gmail.com, rithy.thon@gmail.com, sok.dara@gmail.com, sreypov.kim@gmail.com,
      tena.heng@gmail.com, vannak.heng@gmail.com
  otp:
    # A code shown in the reply would let anyone sign in to (or reset) any account.
    expose-dev-code: false
  payment:
    simulator:
      enabled: true
  orders:
    dev-endpoints: false

log:
  dir: ${LOG_DIR:/app/logs}
