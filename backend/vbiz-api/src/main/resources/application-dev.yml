# All values come from environment variables (see backend/.env.example). Flyway does not run
# here; migrations are applied by the deploy pipeline.
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  flyway:
    enabled: false

vbiz:
  auth:
    google-dev-enabled: true
  otp:
    # No SMS / email gateway yet: dev returns the code as data.devCode.
    expose-dev-code: true
  payment:
    # No Bakong merchant credentials yet: "Simulate payment" confirms KHQR transfers.
    simulator:
      enabled: true

log:
  dir: ${LOG_DIR:./logs}
