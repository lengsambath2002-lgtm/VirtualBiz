spring:
  output:
    ansi:
      enabled: ALWAYS
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5433/vbiz}
    username: ${DATABASE_USERNAME:vbiz}
    password: ${DATABASE_PASSWORD:vbiz}
  flyway:
    enabled: true
    baseline-on-migrate: true
    # Demo accounts and businesses (local only).
    locations: classpath:db/migration,classpath:db/seed-local

vbiz:
  jwt:
    # Local-only default. Every other environment must set VBIZ_JWT_SECRET.
    secret: ${VBIZ_JWT_SECRET:local-dev-only-secret-change-me-0123456789abcdef}
  security:
    # Local-only default. Every other environment must set VBIZ_DATA_KEY.
    data-key: ${VBIZ_DATA_KEY:bG9jYWwtZGV2LW9ubHktZGF0YS1rZXktMzJieXRlcyE=}
  staff:
    app-url: ${VBIZ_APP_URL:http://localhost:3001}
    expose-dev-links: true
  auth:
    cookie-secure: false
    google-dev-enabled: true
  otp:
    expose-dev-code: true
  payment:
    # No Bakong / acquirer credentials locally: "Simulate payment" confirms KHQR transfers.
    simulator:
      enabled: true
  orders:
    # /api/dev/** test hooks (age an order, run the order jobs now).
    dev-endpoints: true
