# Shared settings for every profile. application-<profile>.yml only adds or overrides.
spring:
  application:
    name: vbiz-api
  # SMTP for vbiz.mail (docs/ops/email.md). Locally: Mailpit on 1025, no login.
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    # backend/.env (git-ignored) when running from the backend directory; real env vars win.
    import: "optional:file:.env[.properties]"
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:20}
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        default_batch_fetch_size: 100
  servlet:
    multipart:
      # Image uploads (POST /api/files): vbiz.storage.max-bytes is the real limit.
      max-file-size: 9MB
      max-request-size: 10MB
  flyway:
    # Off by default; only the local profile migrates on start-up (ARCHITECTURE.md §8).
    enabled: false
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8180}
  servlet:
    encoding:
      charset: UTF-8
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # Only check the SMTP server where emails are actually sent.
    mail:
      enabled: ${VBIZ_MAIL_ENABLED:false}

springdoc:
  api-docs:
    path: /api/docs/openapi.json
  swagger-ui:
    path: /api/docs
  paths-to-match: /api/**

vbiz:
  version: ${VBIZ_VERSION:dev}
  jwt:
    # Required outside local/test: at least 32 bytes.
    secret: ${VBIZ_JWT_SECRET:}
    access-ttl: 15m
    issuer: vbiz
  auth:
    refresh-ttl: 30d
    cookie-secure: true
    google-dev-enabled: false
  otp:
    expose-dev-code: false
  google:
    client-id: ${VBIZ_GOOGLE_CLIENT_ID:}
  # docs/api/phase3-orders-checkout.md
  orders:
    auto-cancel-after: PT1H
    customer-cancel-window: PT5M
    undo-accept-window: PT30S
    return-window: P7D
    jobs:
      enabled: true
      interval: ${VBIZ_ORDER_JOBS_INTERVAL:PT1M}
    dev-endpoints: false
  bookings:
    # how long the provider's "Undo" toast can put a change back
    undo-window: PT30S
    # GET /api/appointments and /api/blocks without from / to
    past-days: 60
    future-days: 90
  storage:
    # Where uploaded images are kept: local (disk under dir) or db (the database, for a host whose
    # disk is wiped on restart). An S3 / MinIO backend can replace either.
    type: ${VBIZ_STORAGE_TYPE:local}
    dir: ${VBIZ_STORAGE_DIR:./data/uploads}
    max-bytes: 8388608
  security:
    # Required everywhere but local / test: 32 random bytes, Base64 (openssl rand -base64 32).
    # Encrypts staff two-step sign-in keys at rest. Changing it disables every enrolled key.
    data-key: ${VBIZ_DATA_KEY:}
  # docs/api/phase9-staff-security.md
  staff:
    # true: every staff member must use two-step sign-in (TOTP) to open the console. false: it's
    # optional, and only staff who turned it on are asked for a code (docs/api/phase9-staff-security.md).
    mfa-required: ${VBIZ_STAFF_MFA_REQUIRED:false}
    # How long a two-step check lasts before the console asks again.
    mfa-ttl: PT12H
    invite-ttl: P7D
    # Where invite links point (the web app).
    app-url: ${VBIZ_APP_URL:http://localhost:3000}
    # Return invite links in API responses (no email provider locally).
    expose-dev-links: false
    # First start with no super-admin: create one from these (password must be changed at
    # first sign-in). Ignored once any active super-admin exists.
    bootstrap:
      email: ${VBIZ_BOOTSTRAP_ADMIN_EMAIL:}
      name: ${VBIZ_BOOTSTRAP_ADMIN_NAME:VirtualBiz Admin}
      password: ${VBIZ_BOOTSTRAP_ADMIN_PASSWORD:}
  # docs/ops/email.md: emails (sign-in codes, team and staff invites) go out over SMTP when
  # enabled; otherwise they're only logged. Locally, Mailpit catches them (http://localhost:8025).
  mail:
    enabled: ${VBIZ_MAIL_ENABLED:false}
    from: ${VBIZ_MAIL_FROM:VirtualBiz <no-reply@virtualbiz.com.kh>}
    # Buttons in emails open the web app here.
    app-url: ${vbiz.staff.app-url}
    # Outside production: send only to these addresses or domains (comma-separated); others are
    # logged and skipped. Empty: everyone.
    only-to: ${VBIZ_MAIL_ONLY_TO:}
  # docs/ops/firebase.md: sign-in with Google and email + password through Firebase Auth, and push
  # notifications through Firebase Cloud Messaging. Off: VirtualBiz's own sign-in, no push.
  firebase:
    enabled: ${VBIZ_FIREBASE_ENABLED:false}
    credentials: ${VBIZ_FIREBASE_CREDENTIALS:}
    project-id: ${VBIZ_FIREBASE_PROJECT_ID:}
  # docs/api/phase10-shop-team.md: shop owners invite their team.
  team:
    invite-ttl: P7D
    app-url: ${vbiz.staff.app-url}
    expose-dev-links: ${vbiz.staff.expose-dev-links}
  # Commission, payout delay and the riel rate are platform settings (table platform_settings),
  # changed by a super-admin from the console.
  payment:
    khqr:
      # VirtualBiz's merchant Bakong account (collects online payments, pays shops out).
      bakong-id: ${VBIZ_KHQR_BAKONG_ID:virtualbiz@aclb}
      merchant-name: VirtualBiz
      merchant-city: Phnom Penh
      ttl: PT3M
    simulator:
      enabled: false
